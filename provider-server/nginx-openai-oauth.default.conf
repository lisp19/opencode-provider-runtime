user www-data;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;

include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
}

http {
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    server_tokens off;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    client_max_body_size 32m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    access_log /var/log/nginx/access.log;

    gzip on;

    # Example direct API forwarding block.
    # Replace the listen port and upstream host to match your provider.
    server {
        listen <api_proxy_listen_port>;
        server_name localhost;

        location / {
            proxy_pass https://<api_upstream_host>;
            proxy_set_header Host <api_upstream_host>;

            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_buffer_size 16384k;
            proxy_buffers 4 16384k;
            proxy_busy_buffers_size 16384k;
        }
    }

    # OpenAI OAuth / Codex sample.
    # Runtime requests continue to hit the legacy runtime upstream.
    # Codex provider endpoints are routed to the separate responses/models upstream.
    server {
        listen <oauth_proxy_listen_port>;
        server_name localhost;

        # Codex provider API -> local responses/models server.
        location /v1/ {
            proxy_pass http://127.0.0.1:<codex_provider_upstream_port>;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_set_header Accept-Encoding "";

            proxy_buffer_size 16384k;
            proxy_buffers 4 16384k;
            proxy_busy_buffers_size 16384k;
        }

        location /models {
            proxy_pass http://127.0.0.1:<codex_provider_upstream_port>;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_set_header Accept-Encoding "";

            proxy_buffer_size 16384k;
            proxy_buffers 4 16384k;
            proxy_busy_buffers_size 16384k;
        }

        location /responses {
            proxy_pass http://127.0.0.1:<codex_provider_upstream_port>;

            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_set_header Accept-Encoding "";

            proxy_buffer_size 16384k;
            proxy_buffers 4 16384k;
            proxy_busy_buffers_size 16384k;
        }

        # Legacy OpenCode runtime relay.
        location / {
            # Optional direct upstream form:
            # proxy_pass https://chatgpt.com;
            proxy_pass http://127.0.0.1:<oauth_runtime_upstream_port>;

            # Optional headers used when forwarding directly to chatgpt.com.
            # proxy_set_header Host chatgpt.com;
            # proxy_set_header Origin https://chatgpt.com;
            # proxy_set_header Referer https://chatgpt.com/;

            # Preserve client protocol information for OAuth/session checks.
            # proxy_set_header X-Forwarded-Proto https;

            # Optional cookie domain rewrite when exposing a public proxy domain.
            # proxy_cookie_domain chatgpt.com <public_proxy_domain>;

            proxy_http_version 1.1;
            proxy_ssl_server_name on;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;

            proxy_set_header Accept-Encoding "";

            proxy_buffer_size 16384k;
            proxy_buffers 4 16384k;
            proxy_busy_buffers_size 16384k;
        }
    }
}
